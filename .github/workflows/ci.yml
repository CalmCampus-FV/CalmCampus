name: CI

# Research and design archive: the iOS app moved to CalmApp and the web preview to CalmUni,
# each with its own CI. This checks what is left here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ml/ Python compiles
        run: python3 -m py_compile ml/*.py ml/data/*.py
      - name: README wording (no pilot claims, no banned phrases, no em dashes)
        run: |
          if grep -n -i -E "early sign|stop burnout|pilot|—" README.md; then
            echo "README.md uses wording CalmCampus does not use"; exit 1
          fi
